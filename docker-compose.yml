# Punto de partida del Tutorial 5: la aplicación dockerizada (Tutorial 4).
# Django con runserver publicado en el puerto 8000 y PostgreSQL como base de datos.
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      # Contraseña de ejemplo para el laboratorio. No la use en ningún sistema real.
      - POSTGRES_PASSWORD=secret_password
    # depends_on solo espera a que el contenedor arranque, no a que Postgres acepte
    # conexiones. Este chequeo deja a la base en estado "healthy" cuando ya responde.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_ALLOWED_HOSTS=*

volumes:
  postgres_data:
