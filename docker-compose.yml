# Tutorial 5: Nginx + Gunicorn + Django + PostgreSQL (tres contenedores)
#
# No lleva la línea "version:" que traía el PDF: Docker Compose v2 la ignora
# y avisa con una advertencia de que está obsoleta.
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      # ADVERTENCIA: contraseña de ejemplo tomada del enunciado, solo para este
      # laboratorio. No la reutilice en ningún sistema real.
      - POSTGRES_PASSWORD=secret_password
    # depends_on por sí solo no espera a que Postgres acepte conexiones.
    # Con este chequeo la base pasa a "healthy" cuando ya responde, y web
    # espera ese estado antes de arrancar (ver depends_on de web).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    # CAMBIO 1: usamos Gunicorn en lugar de runserver.
    # 'Tienda' es la carpeta de este proyecto donde vive wsgi.py (el PDF dice
    # 'tienda_project', que aquí no existe).
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
      # Detrás de Nginx la cabecera Host trae la IP de la EC2. '*' acepta cualquiera,
      # aceptable en el laboratorio; en un sistema real ponga su IP o dominio.
      - DJANGO_ALLOWED_HOSTS=*
    # NOTA: ya no hay sección 'ports' aquí. Django queda aislado del exterior
    # y solo Nginx le habla, por la red interna de Docker.

  # CAMBIO 2: agregamos el servicio Nginx
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"   # Nginx es el único que da la cara a internet
    volumes:
      # Inyectamos nuestro archivo de configuración en el contenedor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
