<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Inventario de la tienda</title>
</head>
<body>
    <h1>Inventario</h1>

    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>Id</th>
                <th>Libro</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Comprar</th>
            </tr>
        </thead>
        <tbody>
            {% for libro in libros %}
            <tr>
                <td>{{ libro.id }}</td>
                <td>{{ libro.titulo }}</td>
                <td>${{ libro.precio }}</td>
                <td class="stock" data-libro-id="{{ libro.id }}">{{ libro.stock_actual }}</td>
                <td>
                    <a href="{% url 'compra_rapida' libro.id %}">Compra rápida</a> |
                    <a href="{% url 'finalizar_compra' libro.id %}">Compra</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No hay libros. Ejecute <code>python manage.py preparar_datos</code>.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
