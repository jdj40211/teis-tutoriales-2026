# nginx/nginx.conf (Tutorial 6: Strangler Pattern)

# Formato de log propio: además de la petición, dice QUÉ backend la atendió.
# El log por defecto de Nginx no trae esa información, y el enunciado pide ver
# en 'docker compose logs nginx' que las peticiones van a dos backends distintos.
#   backend  = nombre lógico (lo fija cada location con 'set $backend')
#   upstream = IP:puerto real del contenedor (8000 = Django, 5000 = Flask)
log_format estrangulador '$remote_addr [$time_local] "$request" $status '
                         'backend=$backend upstream=$upstream_addr';

# El monolito (v1). El nombre debe coincidir con el servicio del docker-compose.
upstream django_v1 {
    server web_django:8000;
}

# El microservicio nuevo (v2)
upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log estrangulador;

    # Ignorar logs de favicon para no saturar el servidor
    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA VIEJA: sigue yendo a Django
    location /api/v1/ {
        set $backend django_v1;
        proxy_pass http://django_v1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # RUTA NUEVA: estrangulamos la función de compra y la mandamos a Flask.
    # Nginx pasa la ruta completa (/api/v2/comprar), sin recortarla, y por eso la
    # ruta de Flask (@app.route) tiene que ser exactamente esa.
    location /api/v2/comprar {
        set $backend flask_v2;
        proxy_pass http://flask_v2;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # RUTA RAÍZ (la del Tutorial 5): todo lo demás sigue en Django.
    # El PDF del Tutorial 6 la omite, pero sin ella páginas como /inventario/ o /
    # devolverían 404 de Nginx. Nginx elige siempre el location más específico,
    # así que /api/v1/ y /api/v2/comprar ganan sobre esta.
    location / {
        set $backend django_v1;
        proxy_pass http://django_v1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
